<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dark Luxury Obsidian Background Gradient -->
    <radialGradient id="bgObsidian" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Liquid Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="25%" stop-color="#fbc02d" />
      <stop offset="50%" stop-color="#f57f17" />
      <stop offset="75%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#fff176" />
    </linearGradient>

    <!-- Neon Cyan Metallic Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Guitar Body Deep Shader -->
    <linearGradient id="bodyShader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- High Precision Glow Filters -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container (App Icon standard) -->
  <rect width="512" height="512" rx="115" fill="url(#bgObsidian)" stroke="url(#goldMetallic)" stroke-width="5" />

  <!-- Outer Neon Pulse Rings (Music Waves) -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#cyanNeon)" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldMetallic)" stroke-width="1" opacity="0.2" />

  <!-- GUITAR GROUP - ROTATED 45 DEGREES FOR DYNAMIC ELEGANCE -->
  <g transform="rotate(-45, 256, 256)">

    <!-- Shadow Layer -->
    <ellipse cx="256" cy="340" rx="90" ry="110" fill="#000000" opacity="0.6" filter="url(#goldGlow)" />

    <!-- GUITAR BODY -->
    <path d="
      M 256, 190
      C 215, 190 180, 215 180, 250
      C 180, 275 200, 290 190, 320
      C 175, 360 195 420 256 420
      C 317, 420 337, 360 322, 320
      C 312, 290 332, 275 332, 250
      C 332, 215 297, 190 256, 190 Z"
      fill="url(#bodyShader)"
      stroke="url(#goldMetallic)"
      stroke-width="9"
      filter="url(#goldGlow)"
    />

    <!-- GUITAR NECK -->
    <rect x="246" y="35" width="20" height="160" fill="url(#bodyShader)" stroke="url(#goldMetallic)" stroke-width="4" />
    
    <!-- FRET WIRES -->
    <line x1="246" y1="65" x2="266" y2="65" stroke="url(#goldMetallic)" stroke-width="2.5" />
    <line x1="246" y1="90" x2="266" y2="90" stroke="url(#goldMetallic)" stroke-width="2.5" />
    <line x1="246" y1="115" x2="266" y2="115" stroke="url(#goldMetallic)" stroke-width="2.5" />
    <line x1="246" y1="140" x2="266" y2="140" stroke="url(#goldMetallic)" stroke-width="2.5" />
    <line x1="246" y1="165" x2="266" y2="165" stroke="url(#goldMetallic)" stroke-width="2.5" />

    <!-- HEADSTOCK (CLAVIJERO) -->
    <path d="M 240, 35 L 240, 0 C 240, -10 272, -10 272, 0 L 272, 35 Z" fill="url(#bodyShader)" stroke="url(#goldMetallic)" stroke-width="4" />
    
    <!-- TUNING PEGS (CLAVIJAS GOLD) -->
    <circle cx="230" cy="10" r="6" fill="url(#goldMetallic)" />
    <circle cx="230" cy="24" r="6" fill="url(#goldMetallic)" />
    <circle cx="282" cy="10" r="6" fill="url(#goldMetallic)" />
    <circle cx="282" cy="24" r="6" fill="url(#goldMetallic)" />

    <!-- SOUNDHOLE & ROSETTE -->
    <circle cx="256" cy="260" r="34" fill="#030712" stroke="url(#cyanNeon)" stroke-width="5" filter="url(#cyanGlow)" />
    <circle cx="256" cy="260" r="26" fill="none" stroke="url(#goldMetallic)" stroke-width="2" />
    <circle cx="256" cy="260" r="12" fill="#06b6d4" opacity="0.9" />

    <!-- BRIDGE -->
    <rect x="226" y="370" width="60" height="14" rx="4" fill="url(#bodyShader)" stroke="url(#goldMetallic)" stroke-width="3" />
    <circle cx="236" cy="377" r="2" fill="url(#goldMetallic)" />
    <circle cx="244" cy="377" r="2" fill="url(#goldMetallic)" />
    <circle cx="252" cy="377" r="2" fill="url(#goldMetallic)" />
    <circle cx="260" cy="377" r="2" fill="url(#goldMetallic)" />
    <circle cx="268" cy="377" r="2" fill="url(#goldMetallic)" />
    <circle cx="276" cy="377" r="2" fill="url(#goldMetallic)" />

    <!-- STRINGS -->
    <line x1="248" y1="-2" x2="248" y2="370" stroke="#ffffff" stroke-width="1.2" opacity="0.95" />
    <line x1="251" y1="-2" x2="251" y2="370" stroke="url(#goldMetallic)" stroke-width="1.2" />
    <line x1="254" y1="-2" x2="254" y2="370" stroke="#ffffff" stroke-width="1.2" opacity="0.95" />
    <line x1="258" y1="-2" x2="258" y2="370" stroke="url(#cyanNeon)" stroke-width="1.2" />
    <line x1="261" y1="-2" x2="261" y2="370" stroke="#ffffff" stroke-width="1.2" opacity="0.95" />
    <line x1="264" y1="-2" x2="264" y2="370" stroke="url(#goldMetallic)" stroke-width="1.2" />

    <!-- PICK FLOTANTE -->
    <path d="M 380, 140 C 410, 140 430, 160 415, 205 L 390, 240 C 385, 246 375, 246 370, 240 L 345, 205 C 330, 160 350, 140 380, 140 Z"
          fill="url(#bodyShader)" stroke="url(#goldMetallic)" stroke-width="4" opacity="0.85" filter="url(#goldGlow)" />
    <circle cx="380" cy="180" r="10" fill="none" stroke="url(#cyanNeon)" stroke-width="2" />
  </g>
</svg>
