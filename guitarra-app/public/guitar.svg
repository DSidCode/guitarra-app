<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient (Deep Cyberpunk Obsidian) -->
    <radialGradient id="bgCyber" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Squircle Frame -->
  <rect width="512" height="512" rx="115" fill="url(#bgCyber)" stroke="url(#goldGradient)" stroke-width="6" />

  <!-- Subtle Cyber Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyanGradient)" stroke-width="2" opacity="0.25" stroke-dasharray="12 8" />

  <!-- GUITAR EMBLEM (Rotated -45deg, Perfectly Balanced) -->
  <g transform="rotate(-45, 256, 256)" filter="url(#neonGlow)">
    
    <!-- Mástil -->
    <path d="M 242 80 L 270 80 L 270 280 L 242 280 Z" fill="#090d16" stroke="url(#goldGradient)" stroke-width="4" />
    
    <!-- Cuerdas Neón (Cian y Oro) -->
    <line x1="247" y1="50" x2="247" y2="420" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
    <line x1="252" y1="50" x2="252" y2="420" stroke="#ffe066" stroke-width="1.5" />
    <line x1="257" y1="50" x2="257" y2="420" stroke="#22d3ee" stroke-width="1.5" />
    <line x1="262" y1="50" x2="262" y2="420" stroke="#ffe066" stroke-width="1.5" />
    <line x1="266" y1="50" x2="266" y2="420" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

    <!-- Cuerpo de Guitarra Eléctrica Symmetrical Double-Cut -->
    <path d="
      M 256 210
      C 220 210 170 180 160 250
      C 150 320 180 340 170 380
      C 160 420 210 450 256 450
      C 302 450 352 420 342 380
      C 332 340 362 320 352 250
      C 342 180 292 210 256 210 Z" 
      fill="#0f172a" 
      stroke="url(#cyanGradient)" 
      stroke-width="8" />

    <!-- Guardapúa / Pickguard Neón Dorado Interior -->
    <path d="
      M 256 230
      C 230 230 195 245 190 280
      C 185 315 200 360 240 375
      L 256 375 Z"
      fill="url(#goldGradient)"
      opacity="0.25" />

    <!-- Pastillas / Pickups Humbucker Neón -->
    <rect x="232" y="270" width="48" height="16" rx="4" fill="#03050a" stroke="url(#goldGradient)" stroke-width="3" />
    <rect x="232" y="310" width="48" height="16" rx="4" fill="#03050a" stroke="url(#goldGradient)" stroke-width="3" />

    <!-- Puente de Guitarra (Bridge) -->
    <rect x="226" y="380" width="60" height="18" rx="4" fill="#090d16" stroke="url(#goldGradient)" stroke-width="4" />

    <!-- Perillas de Volumen Neón Cyan -->
    <circle cx="215" cy="405" r="10" fill="#03050a" stroke="url(#cyanGradient)" stroke-width="3" />
    <circle cx="297" cy="405" r="10" fill="#03050a" stroke="url(#cyanGradient)" stroke-width="3" />

    <!-- Clavijero (Headstock Stratocaster Minimalista) -->
    <path d="M 240 80 C 230 50 235 25 256 15 C 275 25 282 50 272 80 Z" fill="#0f172a" stroke="url(#goldGradient)" stroke-width="4" />
    <circle cx="256" cy="35" r="6" fill="#22d3ee" />
  </g>
</svg>
