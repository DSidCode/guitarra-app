<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="guitarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500" />
      <stop offset="50%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  
  <!-- Guitar Silhouette -->
  <path d="M 44 10 C 42 8 38 8 36 10 L 30 18 L 26 22 C 22 20 16 22 14 26 C 12 30 14 36 18 38 C 14 42 12 48 16 52 C 20 56 26 54 30 50 C 34 54 40 56 44 52 C 48 48 46 42 42 38 C 46 36 48 30 46 26 C 44 22 38 20 34 22 L 38 18 Z" fill="url(#guitarGrad)" filter="url(#glow)" />
  
  <!-- Sound Hole -->
  <circle cx="28" cy="38" r="4" fill="#0f172a" stroke="#ffd700" stroke-width="1.5" />
  
  <!-- Guitar Neck & Head -->
  <line x1="28" y1="38" x2="48" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  
  <!-- Strings -->
  <line x1="26" y1="36" x2="46" y2="10" stroke="#ffd700" stroke-width="0.8" />
  <line x1="30" y1="40" x2="50" y2="14" stroke="#ffd700" stroke-width="0.8" />
</svg>
