<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fondo circular / squircle elegante en negro brillante -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Gradiente de Oro Líquido Cyberpunk -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Gradiente de Neón Cian -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sombra/Glow Neón sutil -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Marco Squircle Premium -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" stroke="url(#goldGradient)" stroke-width="6" />

  <!-- Anillo Neón Exterior -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#cyanGradient)" stroke-width="2" opacity="0.3" />

  <!-- SILUETA DE GUITARRA ACÚSTICA ELEGANTE Y RECONOCIBLE -->
  <g transform="rotate(-35, 256, 256)" filter="url(#softGlow)">
    
    <!-- Mástil -->
    <rect x="246" y="70" width="20" height="220" fill="url(#goldGradient)" rx="4" />
    
    <!-- Clavijero (Headstock) -->
    <path d="M 238 70 L 238 35 C 238 28 274 28 274 35 L 274 70 Z" fill="url(#goldGradient)" />
    <!-- Clavijas -->
    <circle cx="230" cy="45" r="5" fill="#fef08a" />
    <circle cx="230" cy="58" r="5" fill="#fef08a" />
    <circle cx="282" cy="45" r="5" fill="#fef08a" />
    <circle cx="282" cy="58" r="5" fill="#fef08a" />

    <!-- Trastes -->
    <line x1="246" y1="95" x2="266" y2="95" stroke="#0f172a" stroke-width="2" />
    <line x1="246" y1="120" x2="266" y2="120" stroke="#0f172a" stroke-width="2" />
    <line x1="246" y1="150" x2="266" y2="150" stroke="#0f172a" stroke-width="2" />
    <line x1="246" y1="180" x2="266" y2="180" stroke="#0f172a" stroke-width="2" />
    <line x1="246" y1="210" x2="266" y2="210" stroke="#0f172a" stroke-width="2" />

    <!-- Cuerpo de Guitarra Acústica (Curves Simétricas Elegantes) -->
    <path d="
      M 256 240
      C 210 240 185 260 185 295
      C 185 320 205 335 195 365
      C 180 405 200 455 256 455
      C 312 455 332 405 317 365
      C 307 335 327 320 327 295
      C 327 260 302 240 256 240 Z" 
      fill="#090d16" 
      stroke="url(#goldGradient)" 
      stroke-width="12" />

    <!-- Rosetón / Boca Acústica -->
    <circle cx="256" cy="310" r="32" fill="#020617" stroke="url(#cyanGradient)" stroke-width="6" />
    <circle cx="256" cy="310" r="22" fill="none" stroke="url(#goldGradient)" stroke-width="2" />

    <!-- Puente -->
    <rect x="226" y="400" width="60" height="16" rx="6" fill="url(#goldGradient)" />
    
    <!-- Cuerdas Blancas Neón -->
    <line x1="249" y1="40" x2="249" y2="400" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
    <line x1="252" y1="40" x2="252" y2="400" stroke="#fef08a" stroke-width="1.5" opacity="0.9" />
    <line x1="255" y1="40" x2="255" y2="400" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
    <line x1="258" y1="40" x2="258" y2="400" stroke="#22d3ee" stroke-width="1.5" opacity="0.9" />
    <line x1="261" y1="40" x2="261" y2="400" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

    <!-- Destello de Luz Neón en la Boca -->
    <circle cx="256" cy="310" r="8" fill="#22d3ee" />
  </g>
</svg>
